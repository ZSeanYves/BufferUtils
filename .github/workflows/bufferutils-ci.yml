name: BufferUtils 0.40 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install latest MoonBit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export MOONBIT_INSTALL_DEV=1
          export MOONBIT_INSTALL_VERSION=nightly
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install matching MoonBit nightly (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MOONBIT_INSTALL_DEV: "1"
          MOONBIT_INSTALL_VERSION: nightly
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install matching MoonBit nightly (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_DEV = "1"
          $env:MOONBIT_INSTALL_VERSION = "nightly"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Record toolchain identity
        shell: bash
        run: |
          moon version --all | tee .moon-version.txt

      - name: Format, interfaces, checks, docs, and tests
        shell: bash
        run: |
          set -o pipefail
          moon update
          moon fmt --check
          moon info --target all
          scripts/normalize_interfaces
          git diff --exit-code
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon doc --frozen
          moon check examples --target native --deny-warn
          moon test examples --target native --deny-warn
          scripts/check_api_surface

  critical-contracts:
    name: critical contract checklist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install latest MoonBit
        shell: bash
        run: |
          export MOONBIT_INSTALL_DEV=1
          export MOONBIT_INSTALL_VERSION=nightly
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          chmod +x scripts/check_critical_contracts
      - name: Run hard contract checklist
        shell: bash
        run: |
          moon update
          scripts/check_critical_contracts

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            compiler: scripts/clang-asan-ubsan
            options: detect_leaks=1:halt_on_error=1
          - sanitizer: tsan
            compiler: scripts/clang-tsan
            options: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - name: Install latest MoonBit
        shell: bash
        run: |
          export MOONBIT_INSTALL_DEV=1
          export MOONBIT_INSTALL_VERSION=nightly
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run native sanitizer tests
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.options }}
          UBSAN_OPTIONS: ${{ matrix.options }}
          TSAN_OPTIONS: ${{ matrix.options }}
        run: |
          moon update
          chmod +x scripts/ar scripts/clang-asan-ubsan scripts/clang-tsan
          MOON_CC="$PWD/${{ matrix.compiler }}" moon test native \
            --target native --release --deny-warn

  coverage:
    name: coverage 95 overall and 90 per package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install latest MoonBit
        shell: bash
        run: |
          export MOONBIT_INSTALL_DEV=1
          export MOONBIT_INSTALL_VERSION=nightly
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Enforce coverage budgets
        shell: bash
        run: |
          moon update
          moon coverage clean
          moon test --target native --enable-coverage --deny-warn
          mkdir -p .tmp/coverage
          moon coverage report -f summary > .tmp/coverage/all.txt
          for package in buffer io async_io native; do
            moon coverage report -f summary -p "$package" > ".tmp/coverage/$package.txt"
          done
          scripts/check_coverage_budget .tmp/coverage/all.txt 95 90 \
            buffer=.tmp/coverage/buffer.txt \
            io=.tmp/coverage/io.txt \
            async_io=.tmp/coverage/async_io.txt \
            native=.tmp/coverage/native.txt

  performance:
    name: MoonBit and Rust performance ratios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install latest MoonBit
        shell: bash
        run: |
          export MOONBIT_INSTALL_DEV=1
          export MOONBIT_INSTALL_VERSION=nightly
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install Rust 1.97.1
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Install unprivileged profiler fallback
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
      - name: Run three calibrated batches per implementation
        shell: bash
        run: |
          moon update
          moon run bench --target native --release --build-only
          moon run bench_async --target native --release --build-only
          cargo build --release --locked --manifest-path bench/rust-reference/Cargo.toml
          moon_binary="$PWD/_build/native/release/build/bench/bench.exe"
          moon_async_binary="$PWD/_build/native/release/build/bench_async/bench_async.exe"
          rust_binary="$PWD/bench/rust-reference/target/release/bufferutils-rust-reference"
          [[ -x "$moon_binary" && -x "$moon_async_binary" && -x "$rust_binary" ]]
          if command -v taskset >/dev/null 2>&1 && taskset --cpu-list "${BUFFERUTILS_BENCH_CPU:-0}" true 2>/dev/null; then
            benchmark_prefix=(taskset --cpu-list "${BUFFERUTILS_BENCH_CPU:-0}")
          else
            benchmark_prefix=()
          fi
          mkdir -p .tmp/bufferutils-bench
          {
            uname -a
            lscpu
            moon version --all
            rustc --version --verbose
            printf '\n/proc/self/cgroup\n'
            cat /proc/self/cgroup
            printf '\nCPU governor\n'
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            printf '\nBenchmark CPU affinity\n'
            if ((${#benchmark_prefix[@]} > 0)); then
              printf '%s\n' "${benchmark_prefix[*]}"
            else
              printf 'unavailable\n'
            fi
          } > .tmp/bufferutils-bench/environment.txt
          run_checked_batch() {
            local label="$1"
            local binary="$2"
            local timing="$3"
            local raw="$4"
            local batch="$5"
            local attempt
            for attempt in 1 2 3; do
              /usr/bin/time -v -o ".tmp/bufferutils-bench/${label}-rss-batch-$batch.txt" \
                "${benchmark_prefix[@]}" "$binary" "$batch" \
                | tee ".tmp/bufferutils-bench/${timing}-batch-$batch.csv"
              if scripts/check_performance_quality \
                ".tmp/bufferutils-bench/${timing}-batch-$batch.csv" \
                ".tmp/bufferutils-bench/${raw}-batch-$batch.csv" \
                0.25 1.75 > ".tmp/bufferutils-bench/${label}-quality-batch-$batch.txt"; then
                return 0
              fi
              echo "noisy $label batch $batch, rerunning attempt $((attempt + 1))" >&2
            done
            echo "benchmark batch remained noisy after three attempts: $label/$batch" >&2
            return 1
          }
          for batch in 1 2 3; do
            run_checked_batch moonbit "$moon_binary" moonbit moonbit-raw "$batch"
            run_checked_batch moonbit-async "$moon_async_binary" moonbit-async moonbit-async-raw "$batch"
          done
          scripts/merge_performance_batches --moonbit-only .tmp/bufferutils-bench
          {
            tail -n +2 .tmp/bufferutils-bench/moonbit.csv
            tail -n +2 .tmp/bufferutils-bench/moonbit-async.csv
          } | awk -F, 'BEGIN { print "name,size,iterations" } { key=$2 FS $3; if (!(key in seen)) { print $2 "," $3 "," ($5 * 4); seen[key]=1 } }' \
            > .tmp/bufferutils-bench/moonbit-iterations.csv
          test "$(head -n 1 .tmp/bufferutils-bench/moonbit-iterations.csv)" = "name,size,iterations"
          for batch in 1 2 3; do
            run_checked_batch rust "$rust_binary" rust rust-raw "$batch"
          done
          scripts/merge_performance_batches .tmp/bufferutils-bench
          scripts/check_performance_budget .tmp/bufferutils-bench/moonbit.csv
          scripts/check_performance_budget .tmp/bufferutils-bench/rust.csv
          scripts/check_copy_evidence \
            .tmp/bufferutils-bench/moonbit.csv \
            .tmp/bufferutils-bench/moonbit-copy-evidence.csv
          scripts/check_copy_evidence \
            .tmp/bufferutils-bench/rust.csv \
            .tmp/bufferutils-bench/rust-copy-evidence.csv
          scripts/check_performance_quality \
            .tmp/bufferutils-bench/moonbit.csv \
            .tmp/bufferutils-bench/moonbit-raw.csv
          scripts/check_performance_quality \
            .tmp/bufferutils-bench/rust.csv \
            .tmp/bufferutils-bench/rust-raw.csv
          scripts/check_async_control_evidence .tmp/bufferutils-bench
          if [[ -f bench/baselines/ubuntu-x86_64-ratios.csv ]]; then
            scripts/check_performance_batches \
              bench/baselines/ubuntu-x86_64-ratios.csv \
              .tmp/bufferutils-bench/moonbit.csv \
              .tmp/bufferutils-bench/rust.csv
          else
            scripts/build_performance_baseline \
              .tmp/bufferutils-bench/ubuntu-x86_64-ratios.csv \
              .tmp/bufferutils-bench/moonbit.csv \
              .tmp/bufferutils-bench/rust.csv
          fi
          rss_dir="$RUNNER_TEMP/bufferutils-rss"
          rss_evidence_dir="$PWD/.tmp/bufferutils-bench/rss-by-case"
          mkdir -p "$rss_dir/.tmp/bufferutils-bench" \
            "$rss_evidence_dir"
          for entry in \
            "shared-clone:$moon_binary:buffer_shared_clone" \
            "shared-slice:$moon_binary:buffer_shared_slice" \
            "shared-split:$moon_binary:buffer_shared_split" \
            "cow:$moon_binary:buffer_cow_mutation" \
            "growth:$moon_binary:buffer_growth" \
            "raw-read:$moon_binary:sync_raw_read" \
            "bufreader-small:$moon_binary:sync_bufreader_small" \
            "bufreader-bypass:$moon_binary:sync_bufreader_bypass" \
            "raw-small-write:$moon_binary:sync_raw_small_write" \
            "bufwriter-small:$moon_binary:sync_bufwriter_small" \
            "bufwriter-bypass:$moon_binary:sync_bufwriter_bypass" \
            "short-write:$moon_binary:sync_short_write_16" \
            "vectored-fallback:$moon_binary:sync_vectored_fallback" \
            "vectored-bulk:$moon_binary:sync_vectored_bulk" \
            "async-copy:$moon_async_binary:async_copy"; do
            IFS=: read -r label binary case_name <<< "$entry"
            (
              cd "$rss_dir"
              /usr/bin/time -v \
                -o "$rss_evidence_dir/$label.txt" \
                "${benchmark_prefix[@]}" "$binary" 1 "$case_name" \
                > "$rss_evidence_dir/$label.csv"
            )
          done
          profile_dir="$RUNNER_TEMP/bufferutils-profile"
          mkdir -p "$profile_dir/.tmp/bufferutils-bench"
          if command -v perf >/dev/null 2>&1; then
            (
              cd "$profile_dir"
              perf record -F 99 -g -o moonbit-bufwriter.perf.data -- \
                "${benchmark_prefix[@]}" "$moon_binary" 1 sync_bufwriter_small \
                > moonbit-bufwriter-profile.csv \
                2> moonbit-bufwriter-perf.stderr
              perf report --stdio -i moonbit-bufwriter.perf.data \
                > moonbit-bufwriter-perf.txt
            ) || printf 'perf profiling unavailable on this runner\n' \
              > "$profile_dir/perf-unavailable.txt"
          fi
          for entry in \
            "shared-slice:$moon_binary:buffer_shared_slice" \
            "raw-read:$moon_binary:sync_raw_read" \
            "bufreader-small:$moon_binary:sync_bufreader_small" \
            "raw-small-write:$moon_binary:sync_raw_small_write" \
            "bufwriter-small:$moon_binary:sync_bufwriter_small" \
            "short-write:$moon_binary:sync_short_write_16" \
            "vectored-bulk:$moon_binary:sync_vectored_bulk" \
            "async-copy:$moon_async_binary:async_copy"; do
            IFS=: read -r label binary case_name <<< "$entry"
            (
              cd "$profile_dir"
              valgrind --tool=callgrind --collect-jumps=yes \
                --callgrind-out-file="$label.callgrind" \
                "${benchmark_prefix[@]}" "$binary" 1 "$case_name" > "$label-profile.csv" \
                2> "$label-callgrind.stderr"
              callgrind_annotate --inclusive=yes --threshold=0.5 \
                "$label.callgrind" > "$label-callgrind.txt"
            )
          done
          cp -R "$profile_dir" .tmp/bufferutils-bench/profile
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-x86_64-performance-evidence
          path: .tmp/bufferutils-bench
